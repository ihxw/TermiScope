# Copy to configs/config.yaml and set secrets (or use TERMISCOPE_JWT_SECRET / TERMISCOPE_ENCRYPTION_KEY).
# Do not commit config.yaml with real secrets.

database:
    path: ./data/termiscope.db
log:
    file: ./logs/app.log
    level: info
security:
    access_expiration: 60m
    # jwt_secret: <64+ hex chars or set TERMISCOPE_JWT_SECRET>
    # encryption_key: <32 hex chars or set TERMISCOPE_ENCRYPTION_KEY>
    login_rate_limit: 20
    refresh_expiration: 168h
server:
    # 通过 HTTPS 反向代理或公网域名访问时必须设置。
    # Agent 使用此地址回传监控数据；未设置时，TLS 终止型反向代理后可能生成错误的 http 地址。
    # public_base_url: https://termiscope.example.com
    # 仅填写实际反向代理地址；留空表示不信任 X-Forwarded-For。
    trusted_proxies: []
    allowed_origins:
        - http://localhost:5173
        - http://127.0.0.1:5173
        - http://localhost:8080
        - http://127.0.0.1:8080
    max_upload_size: 524288000
    mode: release
    port: 8080
    timezone: Local
ssh:
    idle_timeout: 30m
    max_connections_per_user: 10
    # Per-file SFTP request pipeline and server-wide transfer limits.
    sftp_concurrency: 32
    max_sftp_operations: 16
    max_sftp_operations_per_user: 8
    timeout: 30s
